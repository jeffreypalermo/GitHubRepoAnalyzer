name: Release

on:
  push:
    branches:
      - master
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Version tag to release (e.g. v1.1.0)'
        required: true
        default: 'v1.1.0'

permissions:
  contents: write

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.x'
          dotnet-quality: 'ga'

      - name: Restore
        run: dotnet restore GithubDashboard.Tests

      - name: Run tests
        run: dotnet test GithubDashboard.Tests --configuration Release --verbosity normal

  publish:
    name: Publish (${{ matrix.rid }})
    needs: test
    # Only publish binaries when triggered by a tag or workflow_dispatch
    if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - rid: win-x64
            artifact: gh-dashboard-win-x64.exe
            exe_ext: .exe
          - rid: linux-x64
            artifact: gh-dashboard-linux-x64
            exe_ext: ''
          - rid: osx-x64
            artifact: gh-dashboard-osx-x64
            exe_ext: ''
          - rid: osx-arm64
            artifact: gh-dashboard-osx-arm64
            exe_ext: ''

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.x'
          dotnet-quality: 'ga'

      - name: Publish single-file binary
        run: |
          dotnet publish GithubDashboard.Api \
            --configuration Release \
            --runtime ${{ matrix.rid }} \
            --self-contained true \
            --output publish/${{ matrix.rid }} \
            -p:VersionSuffix=build.${{ github.run_number }}

      - name: Stage artifact
        run: |
          src="publish/${{ matrix.rid }}/gh-dashboard${{ matrix.exe_ext }}"
          cp "$src" "${{ matrix.artifact }}"
          ls -lh "${{ matrix.artifact }}"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.artifact }}

  release:
    name: Create GitHub Release
    needs: publish
    runs-on: ubuntu-latest
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          merge-multiple: true

      - name: List artifacts
        run: ls -lh

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name || inputs.tag }}
          files: |
            gh-dashboard-win-x64.exe
            gh-dashboard-linux-x64
            gh-dashboard-osx-x64
            gh-dashboard-osx-arm64
          generate_release_notes: true
          fail_on_unmatched_files: true
